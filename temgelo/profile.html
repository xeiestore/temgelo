<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Perfil – Tem Gelo?</title>
  <script>
    (function () {
      try {
        sessionStorage.setItem("temgelo_seller_view", "profile");
        var t = localStorage.getItem("temgelo_seller_token") || sessionStorage.getItem("temgelo_seller_token");
        if (t) document.documentElement.classList.add("seller-has-session");
        document.documentElement.classList.add("seller-view-profile");
      } catch (_) {}
      location.replace("seller.html?view=profile#perfil");
    })();
  </script>
</head>
<body style="background:#0f172a;color:#94a3b8;font-family:system-ui;padding:24px">
  A abrir Perfil…
  <p><a href="seller.html?view=profile#perfil" style="color:#93c5fd">Continuar</a></p>
</body>
</html>
