<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Tem Gelo? Encontre baldes de gelo perto de si em Angola." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tem Gelo?" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <title>Tem Gelo? – Angola</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top bar -->
  <div class="topbar">
    <a href="./" class="logo" aria-label="Tem Gelo?">
      <img src="images/logo-header-dark.png" alt="Tem Gelo?" height="40" style="height:40px;width:auto;display:block;" />
    </a>
    <div class="badge" id="seller-count">— vendedores</div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="dot green"></span> <span id="legend-ok">Tem gelo</span></div>
    <div class="legend-item"><span class="dot red"></span> <span id="legend-no">Sem gelo / expirado</span></div>
  </div>

  <!-- Safety banner -->
  <div class="safety-banner" id="safety-banner">
    <div>
      <strong id="safety-title">Atenção de Segurança:</strong>
      <span id="safety-body">
        Se uma zona ou bairro parecer suspeito, não entre.
        Criminosos podem usar a app para atrair pessoas.
        Confirme sempre por telefone/WhatsApp antes de ir e prefira zonas conhecidas.
      </span>
    </div>
    <button type="button" aria-label="Fechar" onclick="document.getElementById('safety-banner').classList.add('hidden')">×</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/sellers.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register service worker for installable / offline support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("SW registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
