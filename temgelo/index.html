<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Tem Gelo? Encontre baldes de gelo perto de si em Angola." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tem Gelo?" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <title>Tem Gelo? – Angola</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top bar -->
  <div class="topbar">
    <button type="button" class="hamburger-btn topbar-hamburger" id="public-hamburger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="/index.html" class="logo" id="home-logo" aria-label="Tem Gelo? – início">
      <img src="images/logo-header-dark.png" alt="Tem Gelo?" height="40" style="height:40px;width:auto;display:block;" />
    </a>
    <div class="badge" id="seller-count">— vendedores</div>
  </div>

  <!-- Public drawer -->
  <div class="drawer-backdrop hidden" id="public-drawer-backdrop"></div>
  <nav class="drawer hidden" id="public-drawer" aria-hidden="true">
    <div class="drawer-header">
      <img src="images/logo-header-dark.png" alt="Tem Gelo?" height="32" />
      <button type="button" class="drawer-close" id="public-drawer-close" aria-label="Fechar">×</button>
    </div>
    <div class="drawer-nav" id="public-drawer-nav">
      <!-- filled by JS based on seller login state -->
    </div>
  </nav>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="dot green"></span> <span id="legend-ok">Tem gelo</span></div>
    <div class="legend-item"><span class="dot red"></span> <span id="legend-no">Sem gelo / expirado</span></div>
  </div>

  <!-- Safety banner -->
  <div class="safety-banner" id="safety-banner">
    <div>
      <strong id="safety-title">Atenção de Segurança:</strong>
      <span id="safety-body">
        Se uma zona ou bairro parecer suspeito, não entre.
        Criminosos podem usar a app para atrair pessoas.
        Confirme sempre por telefone/WhatsApp antes de ir e prefira zonas conhecidas.
      </span>
    </div>
    <button type="button" aria-label="Fechar" onclick="document.getElementById('safety-banner').classList.add('hidden')">×</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/sellers.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register service worker for installable / offline support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then((reg) => {
          reg.update().catch(() => {});
        }).catch((err) => {
          console.warn("SW registration failed:", err);
        });
      });
    }

    // Logo: always land on the public map (with hamburger), never a bare URL without UI
    document.getElementById("home-logo")?.addEventListener("click", (e) => {
      const path = location.pathname.replace(/\/+$/, "") || "/";
      const onHome =
        path === "" ||
        path === "/" ||
        path.endsWith("/index.html") ||
        path.endsWith("/index");
      if (onHome) {
        e.preventDefault();
        // Reset map view if available
        if (typeof map !== "undefined" && map) {
          try {
            map.setView([-11.2, 17.5], 6);
          } catch (_) {}
        }
        window.scrollTo(0, 0);
      }
    });

    // Public hamburger menu (guest vs logged-in seller)
    (function () {
      const TOKEN_KEY = "temgelo_seller_token";
      const btn = document.getElementById("public-hamburger");
      const drawer = document.getElementById("public-drawer");
      const backdrop = document.getElementById("public-drawer-backdrop");
      const closeBtn = document.getElementById("public-drawer-close");
      const nav = document.getElementById("public-drawer-nav");

      const iconUser = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      const iconLogin = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>';
      const iconStock = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 2H4c-1 0-2 1-2 2v16c0 1 1 2 2 2h16c1 0 2-1 2-2V4c0-1-1-2-2-2zM9 4h2v5l-1-.75L9 9V4zm11 16H4V4h3v9l3-2.25L13 13V4h7v16z"/></svg>';
      const iconMap = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>';
      const iconSafety = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
      const iconLogout = '<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>';

      function isSellerLoggedIn() {
        return !!(localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY));
      }

      function renderNav() {
        if (!nav) return;
        const loggedIn = isSellerLoggedIn();
        if (loggedIn) {
          nav.innerHTML =
            '<div class="drawer-section-label">Área do vendedor</div>' +
            '<a href="seller.html" class="drawer-link">' + iconStock + ' Meu stock</a>' +
            '<a href="seller.html#perfil" class="drawer-link">' + iconUser + ' Perfil</a>' +
            '<a href="seller.html" class="drawer-link">' + iconMap + ' Painel</a>' +
            '<a href="#" class="drawer-link drawer-link-danger" id="public-seller-logout">' + iconLogout + ' Sair</a>' +
            '<a href="#safety-banner" class="drawer-link" id="link-safety">' + iconSafety + ' Segurança</a>';
        } else {
          nav.innerHTML =
            '<a href="seller.html" class="drawer-link">' + iconLogin + ' Entrar</a>' +
            '<a href="seller.html#registar" class="drawer-link">' + iconUser + ' Criar conta</a>' +
            '<a href="#safety-banner" class="drawer-link" id="link-safety">' + iconSafety + ' Segurança</a>';
        }

        document.getElementById("link-safety")?.addEventListener("click", (e) => {
          e.preventDefault();
          close();
          document.getElementById("safety-banner")?.classList.remove("hidden");
        });
        document.getElementById("public-seller-logout")?.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem(TOKEN_KEY);
          sessionStorage.removeItem(TOKEN_KEY);
          close();
          renderNav();
        });
      }

      function open() {
        renderNav();
        drawer.classList.remove("hidden");
        backdrop.classList.remove("hidden");
        drawer.setAttribute("aria-hidden", "false");
        btn.setAttribute("aria-expanded", "true");
      }
      function close() {
        drawer.classList.add("hidden");
        backdrop.classList.add("hidden");
        drawer.setAttribute("aria-hidden", "true");
        btn.setAttribute("aria-expanded", "false");
      }
      btn?.addEventListener("click", () => drawer.classList.contains("hidden") ? open() : close());
      backdrop?.addEventListener("click", close);
      closeBtn?.addEventListener("click", close);
      renderNav();
    })();
  </script>
</body>
</html>
