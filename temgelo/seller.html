<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <title>Área do vendedor – Tem Gelo?</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="seller-body">
  <!-- Top bar -->
  <header class="seller-topbar">
    <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="./" class="logo" aria-label="Tem Gelo?">
      <img src="images/logo-header-dark.png" alt="Tem Gelo?" height="36" />
    </a>
    <span class="seller-topbar-title" id="topbar-title">Vendedor</span>
  </header>

  <!-- Hamburger drawer -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>
  <nav class="drawer hidden" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <img src="images/logo-header-dark.png" alt="Tem Gelo?" height="32" />
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Fechar">×</button>
    </div>
    <div class="drawer-nav" id="drawer-nav">
      <!-- filled by JS depending on auth state -->
    </div>
  </nav>

  <main class="seller-main">
    <!-- Auth screens -->
    <section id="screen-auth" class="seller-screen">
      <div class="card seller-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login" id="tab-login">Entrar</button>
          <button type="button" class="auth-tab" data-tab="register" id="tab-register">Criar conta</button>
        </div>

        <!-- Login -->
        <div id="form-login">
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="login-whatsapp" placeholder="2449xxxxxxxx" autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Palavra-passe</label>
            <div class="password-field">
              <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="password-toggle" data-target="login-password" aria-label="Mostrar palavra-passe" title="Mostrar / ocultar">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 4.27 3.28 3 21 20.72 19.73 22l-2.2-2.2C15.9 20.56 14 21 12 21 5 21 2 14 2 14a18.5 18.5 0 0 1 5.06-6.28L2 4.27zM12 7a5 5 0 0 1 5 5c0 .7-.15 1.36-.4 1.96l-1.57-1.57A3 3 0 0 0 12 9a3 3 0 0 0-2.39 1.19L7.96 8.54A4.96 4.96 0 0 1 12 7zm0 12c2.04 0 3.87-.53 5.4-1.34l-1.55-1.55c-.96.55-2.1.89-3.85.89a5 5 0 0 1-5-5c0-.45.07-.88.18-1.29L5.1 9.63A16.1 16.1 0 0 0 4.05 14S7 19 12 19z"/></svg>
              </button>
            </div>
          </div>
          <label class="checkbox-row stay-row">
            <input type="checkbox" id="login-stay" checked />
            <span>Manter sessão iniciada</span>
          </label>
          <button class="btn btn-primary btn-block" type="button" id="btn-login">Entrar</button>
        </div>

        <!-- Register -->
        <div id="form-register" class="hidden">
          <p class="text-sm text-muted mb-2">
            Após registar, a sua conta fica <strong>pendente</strong> até o administrador aprovar.
            Só depois aparece no mapa público.
          </p>
          <div class="form-group">
            <label>Nome / identificação</label>
            <input type="text" id="reg-name" placeholder="Ex: João – Viana" />
          </div>
          <div class="form-group">
            <label>WhatsApp (com código do país)</label>
            <input type="tel" id="reg-whatsapp" placeholder="2449xxxxxxxx" />
          </div>
          <div class="form-group">
            <label>Palavra-passe (mín. 6 caracteres)</label>
            <div class="password-field">
              <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
              <button type="button" class="password-toggle" data-target="reg-password" aria-label="Mostrar palavra-passe" title="Mostrar / ocultar">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 4.27 3.28 3 21 20.72 19.73 22l-2.2-2.2C15.9 20.56 14 21 12 21 5 21 2 14 2 14a18.5 18.5 0 0 1 5.06-6.28L2 4.27zM12 7a5 5 0 0 1 5 5c0 .7-.15 1.36-.4 1.96l-1.57-1.57A3 3 0 0 0 12 9a3 3 0 0 0-2.39 1.19L7.96 8.54A4.96 4.96 0 0 1 12 7zm0 12c2.04 0 3.87-.53 5.4-1.34l-1.55-1.55c-.96.55-2.1.89-3.85.89a5 5 0 0 1-5-5c0-.45.07-.88.18-1.29L5.1 9.63A16.1 16.1 0 0 0 4.05 14S7 19 12 19z"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Bairro / zona</label>
            <input type="text" id="reg-neighborhood" placeholder="Viana, Talatona…" />
          </div>
          <div class="form-group">
            <label>Localização no mapa</label>
            <p class="text-sm text-muted mb-1">Toque no mapa ou use GPS.</p>
            <div id="reg-map" class="seller-mini-map"></div>
            <div class="form-row mt-1">
              <div class="form-group">
                <label>Lat</label>
                <input type="number" id="reg-lat" step="any" />
              </div>
              <div class="form-group">
                <label>Lng</label>
                <input type="number" id="reg-lng" step="any" />
              </div>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" id="btn-reg-gps"><svg class="btn-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg> Usar a minha localização</button>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Preço (Kz)</label>
              <input type="text" id="reg-price" placeholder="1500" value="1500" />
            </div>
            <div class="form-group">
              <label>Baldes</label>
              <input type="number" id="reg-buckets" min="0" value="0" />
            </div>
          </div>
          <div class="form-group">
            <label>Congelamento</label>
            <select id="reg-freeze">
              <option value="muito_congelado">Muito congelado</option>
              <option value="parcial">Parcialmente congelado</option>
              <option value="fraco">Fraco / a derreter</option>
            </select>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="reg-available" />
            <span>Tenho gelo disponível agora</span>
          </label>
          <button class="btn btn-primary btn-block mt-2" type="button" id="btn-register">Criar conta</button>
        </div>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="screen-dash" class="seller-screen hidden">
      <div id="status-banner" class="status-banner"></div>

      <div class="card seller-card">
        <h3>Stock de gelo</h3>
        <p class="text-sm text-muted mb-2">Actualize sempre que o stock mudar. Verde no mapa só se actualizado nas últimas 24h.</p>
        <div class="form-row">
          <div class="form-group">
            <label>Baldes disponíveis</label>
            <input type="number" id="dash-buckets" min="0" />
          </div>
          <div class="form-group">
            <label>Congelamento</label>
            <select id="dash-freeze">
              <option value="muito_congelado">Muito congelado</option>
              <option value="parcial">Parcialmente congelado</option>
              <option value="fraco">Fraco / a derreter</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Preço (Kz)</label>
          <input type="text" id="dash-price" />
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="dash-available" />
          <span>Tenho gelo disponível</span>
        </label>
        <button class="btn btn-green btn-block mt-2" type="button" id="btn-save-stock">Guardar stock</button>
      </div>

      <div class="card seller-card">
        <h3>Perfil</h3>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="dash-name" />
        </div>
        <div class="form-group">
          <label>Bairro / zona</label>
          <input type="text" id="dash-neighborhood" />
        </div>
        <div class="form-group">
          <label>Notas (opcional)</label>
          <textarea id="dash-notes" rows="2" placeholder="Horário, entrega…"></textarea>
        </div>
        <div class="form-group">
          <label>Localização</label>
          <div id="dash-map" class="seller-mini-map"></div>
          <div class="form-row mt-1">
            <div class="form-group">
              <label>Lat</label>
              <input type="number" id="dash-lat" step="any" />
            </div>
            <div class="form-group">
              <label>Lng</label>
              <input type="number" id="dash-lng" step="any" />
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" id="btn-dash-gps"><svg class="btn-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg> Usar a minha localização</button>
        </div>
        <button class="btn btn-primary btn-block" type="button" id="btn-save-profile">Guardar perfil</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/seller.js"></script>
</body>
</html>
